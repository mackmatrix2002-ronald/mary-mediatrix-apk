
name: Build Mary Mediatrix APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Check configuration files
        run: |
          test -f package.json || { echo "Missing package.json"; exit 1; }
          test -f capacitor.config.json || { echo "Missing capacitor.config.json"; exit 1; }

      - name: Install dependencies
        run: npm install

      - name: Prepare website files
        shell: bash
        run: |
          set -eu

          echo "Repository files:"
          ls -la

          mkdir -p www

          for file in \
            index.html \
            rosary.html \
            individualrosary.html \
            grouprosary.html \
            novena.html \
            about.html \
            gawain.html
          do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing $file in repository root"
              exit 1
            fi

            cp "$file" www/
            echo "Copied $file"
          done

          for folder in images mp3; do
            if [ -d "$folder" ]; then
              cp -R "$folder" www/
              echo "Copied $folder"
            else
              echo "WARNING: $folder folder not found"
            fi
          done

          echo "Website preparation complete."

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mary-mediatrix-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
